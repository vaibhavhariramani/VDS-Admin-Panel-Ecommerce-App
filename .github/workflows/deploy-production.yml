name: Deploy production (vishal-store-admin)

# Fires on new-changes or old-api - both deploy live to
# vishal-store-admin.web.app (project ecommerce-26b18). This same file must
# exist on both branches for either branch's push to trigger a run.
on:
  push:
    branches:
      - new-changes
      - old-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"

      - run: flutter pub get
      - run: flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_VISHAL_STORE_ADMIN }}"
          projectId: ecommerce-26b18
          channelId: live

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"

      - run: flutter pub get
      # No signing certs/provisioning profiles configured in CI, so this
      # only verifies the iOS app still compiles - it doesn't archive or export an IPA.
      - run: flutter build ios --release --no-codesign
