name: Build and deploy admin panel (getx-architecture)

# Deploys to local-bazaar-admin-panel.web.app (project
# vaibhav-s-ecommerce-app). new-changes/old-api have their own
# deploy-production.yml / deploy-preview.yml targeting vishal-store-admin
# (project ecommerce-26b18) instead of this file.
on:
  push:
    branches:
      - getx-architecture
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Deploy to local-bazaar-admin-panel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCAL_BAZAAR_ADMIN }}'
          projectId: vaibhav-s-ecommerce-app
          target: local-bazaar-admin
          channelId: live
